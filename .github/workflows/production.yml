name: Production Deployment

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    REGION: us-central1
    SERVICE_NAME: servipalbackend

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v1
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}
                  service_account_key: ${{ secrets.GCP_SA_KEY }}
                  export_default_credentials: true

            - name: Authorize Docker push
              run: gcloud auth configure-docker

            - name: Build and push container
              run: |
                  docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} .
                  docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}

            - name: Deploy to Cloud Run
              run: |
                  gcloud run deploy $SERVICE_NAME \
                    --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
                    --region $REGION \
                    --platform managed \
                    --allow-unauthenticated \
                    --set-env-vars="DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
                    --set-env-vars="REDIS_URL=${{ secrets.PROD_REDIS_URL }}" \
                    --set-env-vars="SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}" \
                    --set-env-vars="JWT_SECRET_KEY=${{ secrets.PROD_JWT_SECRET_KEY }}" \
                    --set-env-vars="ALGORITHM=${{ secrets.PROD_ALGORITHM }}" \
                    --set-env-vars="ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.PROD_ACCESS_TOKEN_EXPIRE_MINUTES }}" \
                    --set-env-vars="REFRESH_TOKEN_EXPIRE_MINUTES=${{ secrets.PROD_REFRESH_TOKEN_EXPIRE_MINUTES }}" \
                    --set-env-vars="AWS_ACCESS_KEY_ID=${{ secrets.PROD_AWS_ACCESS_KEY_ID }}" \
                    --set-env-vars="AWS_SECRET_ACCESS_KEY=${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}" \
                    --set-env-vars="AWS_BUCKET_NAME=${{ secrets.PROD_AWS_BUCKET_NAME }}" \
                    --set-env-vars="AWS_REGION=${{ secrets.PROD_AWS_REGION }}" \
                    --set-env-vars="SMTP_HOST=${{ secrets.MAIL_HOST }}" \
                    --set-env-vars="SMTP_PORT=${{ secrets.MAIL_PORT }}" \
                    --set-env-vars="SMTP_USERNAME=${{ secrets.MAIL_USERNAME }}" \
                    --set-env-vars="SMTP_PASSWORD=${{ secrets.MAIL_PASSWORD }}" \
                    --set-env-vars="FROM_EMAIL=${{ secrets.MAIL_FROM }}" \
                    --set-env-vars="PAYMENT_API_KEY=${{ secrets.PROD_PAYMENT_API_KEY }}" \
                    --set-env-vars="PAYMENT_SECRET_KEY=${{ secrets.PROD_PAYMENT_SECRET_KEY }}" \
                    --set-env-vars="FIREBASE_API_KEY=${{ secrets.PROD_FIREBASE_API_KEY }}" \
                    --set-env-vars="FIREBASE_PROJECT_ID=${{ secrets.PROD_FIREBASE_PROJECT_ID }}"

            - name: Show Output URL
              run: |
                  echo "🚀 Deployment successful!"
                  URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format='value(status.url)')
                  echo "✨ Service URL: $URL"
                  echo "::notice title=Deployment URL::$URL"

            - name: Create GitHub Deployment Status
              if: success()
              run: |
                  URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format='value(status.url)')
                  curl -X POST \
                    -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    https://api.github.com/repos/${{ github.repository }}/deployments/${{ github.run_id }}/statuses \
                    -d '{
                      "state": "success",
                      "environment_url": "'"$URL"'",
                      "description": "Deployment to Cloud Run successful!",
                      "environment": "production"
                    }'
